# Costruisce l'APK Android a ogni modifica su main (o a mano: Actions → Build APK → Run workflow)
# e lo pubblica nelle Release: si scarica dal telefono con
# https://github.com/capofusnez/parcheggio-raduno/releases/latest/download/parcheggio-raduno.apk
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'apps-script/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara i file dell'app
        run: |
          mkdir -p build/www
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/

      - name: Crea il progetto Android
        working-directory: build
        run: |
          npx cap init "Parcheggio Raduno" it.capofusnez.parcheggioraduno --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Versione, colori e icona
        working-directory: build/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          sudo apt-get install -y -qq imagemagick > /dev/null
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=app/src/main/res/mipmap-${d%%:*}; size=${d##*:}
            mkdir -p "$dir"
            convert ../../icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done
          # schermo verticale
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' app/src/main/AndroidManifest.xml

      - name: Compila l'APK
        working-directory: build/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # firma fissa: ogni nuova versione si installa sopra la precedente
          KS="$GITHUB_WORKSPACE/android-debug.keystore"
          cat >> app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  fissa {
                      storeFile file("$KS")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fissa }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../parcheggio-raduno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: parcheggio-raduno-apk
          path: parcheggio-raduno.apk

      - name: Pubblica nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" parcheggio-raduno.apk --target "$GITHUB_SHA" --title "Parcheggio Raduno $TAG" --notes "APK Android. Installa sopra la versione precedente." --latest
